version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: pfm-db
    environment:
      POSTGRES_DB: pfm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pfm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pfm-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/pfm
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: pfm-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pg_data:
